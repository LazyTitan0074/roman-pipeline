name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=scripts --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check scripts/ tests/

  verify-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Verify project structure
        run: |
          python -c "
          from scripts.config import Settings
          from pathlib import Path
          import tempfile
          
          with tempfile.TemporaryDirectory() as tmp:
              base = Path(tmp) / 'workspace'
              proj = Path(tmp) / 'projects' / 'test'
              base.mkdir(parents=True)
              proj.mkdir(parents=True)
              (base / 'CANON.md').write_text('- C01: TEST — test fact')
              (base / 'templates').mkdir()
              for t in ['VOICE.md', 'BEAT_SHEET.md', 'CHAPTER_CHECKLIST.md']:
                  (base / 'templates' / t).write_text('# Template')
              
              s = Settings(base_dir=base, proj_dir=proj, openrouter_api_key='test')
              print('Config validation OK')
              print(f'Base: {s.base_dir}')
              print(f'Proj: {s.proj_dir}')
              print(f'Writer: {s.writer_provider}/{s.writer_model}')
              print(f'Chapters: {s.num_chapters}')
          "

  # Integration test (requires API keys - runs on manual dispatch)
  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Run integration test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
        run: |
          # Create test project
          python -m scripts.cli init ci_test --title "CI Test" --genre Fantasy
          cd ci_test
          cp ../.env.example .env
          # Fill minimal CANON.md
          echo "- C01: TEST — Test protagonist is 20." > CANON.md
          echo "- C02: TEST — Simple story." >> CANON.md
          # Run chapter 1 (will use fallback if no keys)
          python -m scripts.cli chapter 1 --max-attempts 1 || true
          # Verify structure
          python -m scripts.cli verify --check struct