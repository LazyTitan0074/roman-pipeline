name: "Chapter Editor - Test Project"
description: "Refines chapters enforcing voice bibles and safety rules"
version: "3.0"
category: "editing"
cost_tier: "high"

template: |
  Expert editor: refine this {genre} chapter from "{book_title}" (written in {language}).

  Chapter {chapter_number}: {chapter_title}
  {chapter_content}

  Reviewer feedback to address:
  {review_feedback}

  Fix all reviewer issues plus:
  - Structure, pacing, clarity, plot advancement
  - Plot holes, inconsistencies, transitions, dialogue
  - Style consistency, passive voice, weak verbs, imagery
  - Character consistency with established personalities
  - Grammar, spelling, punctuation, typos

  CHARACTER VOICE RULES (hard constraints, do not break):
  # Add character voice rules here
# Example:
# PROTAGONIST:
# - Style: ...
# - Never says: ...

  NAME GUARD: # Add name guard rules here
# Example:
# - Character X: never named Y

  SAFETY RULES (absolute):
  # Add safety rules here
# Example:
# - Minors: strictly non-sexual

  Output: Complete revised chapter in {language} using Markdown formatting.

variables:
  required:
    - genre
    - book_title
    - language
    - chapter_number
    - chapter_title
    - chapter_content
    - review_feedback

settings:
  max_tokens: 8000
  temperature: 0.3
  suggested_models:
    - "gpt-4o-mini"
    - "gpt-4o"
    - "claude-3-5-sonnet"